version: '3.8'

services:
  api:
    build: .
    container_name: aksa_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Veritabanı URL'si (PostgreSQL)
      - DATABASE_URL=postgresql+asyncpg://postgres:aksa_secret_password@db:5432/aksa_health
      
      # Firebase Kimlik Doğrulama Bypass (Geliştirme aşaması için)
      - DEV_MODE=True
      
      # Dış Servis API Anahtarları (Buralara kendi anahtarlarınızı .env üzerinden verebilirsiniz)
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      
    volumes:
      # Modellerin kalıcı olması ve host ile senkronize olması için (Opsiyonel)
      - ./ml_models:/app/ml_models

  db:
    image: postgres:15-alpine
    container_name: aksa_postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=aksa_secret_password
      - POSTGRES_DB=aksa_health
    ports:
      - "5432:5432"
    volumes:
      - aksa_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aksa_health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aksa_pg_data:
    description: PostgreSQL veritabanı kalıcılığı için volume
