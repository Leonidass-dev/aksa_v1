version: '3.8'

services:
  api:
    build: .
    container_name: aksa_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Veritabanı URL'si (PostgreSQL)
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-aksa_secure_password_dev}@db:5432/aksa_health
      
      # Firebase Kimlik Doğrulama Dev Modu (Geliştirme için varsayılan True, canlıda False yapılmalıdır)
      - DEV_MODE=${DEV_MODE:-True}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      
      # Dış Servis API Anahtarları (.env dosyasından yüklenir)
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      
    volumes:
      - ./ml_models:/app/ml_models

  db:
    image: postgres:15-alpine
    container_name: aksa_postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aksa_secure_password_dev}
      - POSTGRES_DB=aksa_health
    ports:
      # Sadece yerel arayüze bağlayarak dış ağdan doğrudan erişimi engeller
      - "127.0.0.1:5432:5432"
    volumes:
      - aksa_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aksa_health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aksa_pg_data:
    description: PostgreSQL veritabanı kalıcılığı için volume
